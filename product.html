<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Товар — Antel Art</title>
<link rel="icon" href="logo-mark.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="catalog.html">

<div id="site-header"></div>

<section class="phead" id="phead"></section>

<section class="sec">
  <div class="wrap">
    <div class="pgrid" id="pgrid"></div>
  </div>
</section>

<section class="sec soft" id="relatedSec">
  <div class="wrap">
    <div class="sec-head"><h2 class="title" data-i18n="prodRelated">Похожие позиции</h2>
      <a href="catalog.html" class="link-all"><span data-i18n="prodBack">Назад в каталог</span> →</a></div>
    <div class="grid" id="related"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script>
const pid = new URLSearchParams(location.search).get('id');
const P = PRODUCTS.find(x => x.id === pid) || PRODUCTS[0];

function renderPage(){
  const L = loc(P);
  document.title = L.name + ' — Antel Art';

  $('#phead').innerHTML = `<div class="wrap">
    <div class="crumbs">
      <a href="index.html">${t('home')}</a><i>/</i>
      <a href="catalog.html">${t('navCatalog')}</a><i>/</i>
      <a href="catalog.html?cat=${P.cat}">${t('cat_'+P.cat)}</a>
    </div>
    <h1>${L.name}</h1>
    <p>${L.short}</p>
  </div>`;

  $('#pgrid').innerHTML = `
    <div class="pgal">
      <div class="big"><img src="img/${P.img}" alt="${L.name}"></div>
    </div>
    <div class="pinfo">
      <span class="unit">${L.unit}</span>
      <p class="desc">${L.desc}</p>

      <div class="pricebox">
        <div class="pv">${t('from')}<b>${P.price} ${t('sum')}</b></div>
        <div class="acts">
          <a href="${TG}" target="_blank" rel="noopener" class="btn btn-lime">${t('prodOrder')}</a>
          <a href="tel:+998555034224" class="btn btn-ghost">${t('prodAsk')}</a>
        </div>
        <p class="note">${t('prodNote')}</p>
      </div>

      <div class="specs">
        <h3>${t('prodSpecs')}</h3>
        <dl>${L.specs.map(([k,v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
      </div>

      <div class="why">
        <div><b>${t('prodWhy1')}</b><small>${t('prodWhy1d')}</small></div>
        <div><b>${t('prodWhy2')}</b><small>${t('prodWhy2d')}</small></div>
        <div><b>${t('prodWhy3')}</b><small>${t('prodWhy3d')}</small></div>
      </div>
    </div>`;

  const rel = PRODUCTS.filter(x => x.cat === P.cat && x.id !== P.id).slice(0,3);
  const pool = rel.length ? rel : PRODUCTS.filter(x => x.id !== P.id).slice(0,3);
  $('#related').innerHTML = pool.map(cardHTML).join('');
}
</script>
<script src="assets/app.js"></script>
</body>
</html>
